<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Control Dashboard - Prime Cuts</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#c41e3a' }
                }
            }
        }
    </script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Space+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .font-mono { font-family: 'Space Mono', monospace; }
    </style>
</head>
<body class="bg-[#050404] text-zinc-100 min-h-screen selection:bg-[#c41e3a] selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="border-b border-neutral-900 bg-black/80 backdrop-blur-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="w-3 h-3 bg-[#c41e3a] inline-block"></span>
                <span class="font-serif text-xl tracking-wider text-white">PRIME CUTS <span class="text-xs font-mono text-[#c41e3a] uppercase tracking-widest ml-2 border border-[#c41e3a]/30 px-2 py-0.5">Control Center</span></span>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openAddModal()" class="bg-[#c41e3a] text-white font-mono text-xs uppercase tracking-wider px-4 py-2 hover:bg-[#d42040] transition-colors cursor-pointer">
                    + Add New Record
                </button>
                <button onclick="clearAllData()" class="bg-neutral-900 border border-neutral-800 text-xs font-mono text-zinc-400 tracking-wider uppercase px-3 py-2 hover:text-[#c41e3a] hover:border-[#c41e3a]/50 transition-colors cursor-pointer" title="Reset Data">
                    Reset
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-8">
        
        <!-- Header & Stats Overview -->
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div class="space-y-2">
                <p class="font-mono text-[#c41e3a] text-[0.65rem] tracking-[0.3em] uppercase">Master Management</p>
                <h1 class="font-serif text-3xl sm:text-4xl text-white">Website Data Control</h1>
            </div>
            <div class="flex gap-4">
                <div class="bg-[#080606] border border-neutral-800 px-5 py-3 min-w-[130px]">
                    <span class="block font-mono text-[0.65rem] text-zinc-500 uppercase tracking-widest">Total Entries</span>
                    <span id="total-count" class="font-serif text-2xl text-white">0</span>
                </div>
            </div>
        </div>

        <!-- Data Management Table Section -->
        <div class="bg-[#080606] border border-neutral-800 overflow-hidden shadow-2xl">
            <div class="p-5 border-b border-neutral-800 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <h2 class="font-mono text-xs tracking-widest uppercase text-zinc-300">Managed Records Database</h2>
                <div class="flex items-center space-x-3 w-full sm:w-auto">
                    <input type="text" id="search-input" onkeyup="filterTable()" placeholder="Search records..." class="w-full sm:w-72 bg-black border border-neutral-800 text-xs px-3 py-2 text-white placeholder-zinc-600 focus:outline-none focus:border-[#c41e3a] transition-colors">
                    <button onclick="exportJSON()" class="bg-neutral-900 border border-neutral-800 text-white font-mono text-xs uppercase tracking-wider px-3 py-2 hover:border-zinc-600 transition-colors cursor-pointer shrink-0">
                        Export JSON
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-neutral-800 bg-black/40 font-mono text-[0.65rem] text-zinc-400 uppercase tracking-wider">
                            <th class="py-4 px-6">ID / Date</th>
                            <th class="py-4 px-6">Name / Title</th>
                            <th class="py-4 px-6">Category / Type</th>
                            <th class="py-4 px-6">Contact / Details</th>
                            <th class="py-4 px-6 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-neutral-900 text-sm font-light text-zinc-300">
                        <!-- Dynamic rows will render here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal for Adding/Editing Records -->
    <div id="record-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#080606] border border-neutral-800 w-full max-w-lg p-6 sm:p-8 space-y-6 relative shadow-2xl">
            <div class="flex justify-between items-center border-b border-neutral-800 pb-4">
                <h3 class="font-serif text-xl text-white">Add New Web Record</h3>
                <button onclick="closeAddModal()" class="text-zinc-500 hover:text-white font-mono text-sm cursor-pointer">[✕]</button>
            </div>
            
            <form id="record-form" onsubmit="saveRecord(event)" class="space-y-4">
                <div class="space-y-1">
                    <label class="block font-mono text-[0.65rem] tracking-[0.2em] text-zinc-400 uppercase">Record Name / Title</label>
                    <input type="text" id="modal-name" required placeholder="e.g. Chef Dara / Special Notice" class="w-full bg-black border border-neutral-800 px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#c41e3a]">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="block font-mono text-[0.65rem] tracking-[0.2em] text-zinc-400 uppercase">Category</label>
                        <input type="text" id="modal-type" required placeholder="e.g. Quote Request / Product" class="w-full bg-black border border-neutral-800 px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#c41e3a]">
                    </div>
                    <div class="space-y-1">
                        <label class="block font-mono text-[0.65rem] tracking-[0.2em] text-zinc-400 uppercase">Contact Info</label>
                        <input type="text" id="modal-contact" required placeholder="Phone or Email" class="w-full bg-black border border-neutral-800 px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#c41e3a]">
                    </div>
                </div>
                <div class="space-y-1">
                    <label class="block font-mono text-[0.65rem] tracking-[0.2em] text-zinc-400 uppercase">Details / Description</label>
                    <textarea id="modal-details" rows="3" placeholder="Enter notes, quantities, or content..." class="w-full bg-black border border-neutral-800 px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#c41e3a] resize-none"></textarea>
                </div>
                <div class="pt-2 flex justify-end space-x-3">
                    <button type="button" onclick="closeAddModal()" class="bg-neutral-900 text-zinc-400 px-4 py-2 text-xs font-mono uppercase tracking-wider hover:text-white cursor-pointer">Cancel</button>
                    <button type="submit" class="bg-[#c41e3a] text-white px-5 py-2 text-xs font-mono uppercase tracking-wider hover:bg-[#d42040] cursor-pointer">Save Record</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Master Control Script Logic -->
    <script>
        // Initial mock data if empty
        let dbRecords = JSON.parse(localStorage.getItem('prime_master_db')) || [
            { id: "1", date: "2026-08-13 10:00", name: "Chef Dara", type: "Quote Request", contact: "+855 12 345 678", details: "Ordered 50kg Premium Ribeye" },
            { id: "2", date: "2026-08-13 11:30", name: "Srey Pov", type: "General Inquiry", contact: "sreypov@gmail.com", details: "Asking about bulk pricing options" }
        ];

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            document.getElementById('total-count').textContent = data.length;

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-16 text-center text-zinc-500 font-mono text-xs">No records available in master database.</td></tr>`;
                return;
            }

            tbody.innerHTML = [...data].reverse().map(item => `
                <tr class="hover:bg-neutral-900/40 transition-colors">
                    <td class="py-4 px-6 font-mono text-xs text-zinc-500 whitespace-nowrap">
                        <div>#${item.id}</div>
                        <div class="text-[0.6rem] text-zinc-600">${item.date}</div>
                    </td>
                    <td class="py-4 px-6 font-medium text-white">${item.name}</td>
                    <td class="py-4 px-6">
                        <span class="font-mono text-[0.6rem] text-[#c41e3a] uppercase tracking-wider border border-[#c41e3a]/30 px-2 py-0.5">${item.type}</span>
                    </td>
                    <td class="py-4 px-6 font-mono text-xs text-zinc-400">
                        <div>${item.contact}</div>
                        <div class="text-zinc-500 text-[0.7rem] max-w-xs truncate">${item.details}</div>
                    </td>
                    <td class="py-4 px-6 text-right whitespace-nowrap space-x-3">
                        <button onclick="deleteRecord('${item.id}')" class="text-xs font-mono text-zinc-500 hover:text-[#c41e3a] transition-colors uppercase tracking-wider cursor-pointer">
                            Delete
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function filterTable() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = dbRecords.filter(item => 
                item.name.toLowerCase().includes(query) || 
                item.type.toLowerCase().includes(query) ||
                item.contact.toLowerCase().includes(query)
            );
            renderTable(filtered);
        }

        function openAddModal() {
            document.getElementById('record-modal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('record-modal').classList.add('hidden');
            document.getElementById('record-form').reset();
        }

        function saveRecord(event) {
            event.preventDefault();
            const newEntry = {
                id: Date.now().toString().slice(-4),
                date: new Date().toISOString().slice(0, 16).replace('T', ' '),
                name: document.getElementById('modal-name').value,
                type: document.getElementById('modal-type').value,
                contact: document.getElementById('modal-contact').value,
                details: document.getElementById('modal-details').value
            };

            dbRecords.push(newEntry);
            localStorage.setItem('prime_master_db', JSON.stringify(dbRecords));
            renderTable(dbRecords);
            closeAddModal();
        }

        function deleteRecord(id) {
            if (confirm("Are you sure you want to delete this record?")) {
                dbRecords = dbRecords.filter(item => item.id !== id);
                localStorage.setItem('prime_master_db', JSON.stringify(dbRecords));
                renderTable(dbRecords);
            }
        }

        function clearAllData() {
            if (confirm("Reset local database records?")) {
                dbRecords = [];
                localStorage.removeItem('prime_master_db');
                renderTable(dbRecords);
            }
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dbRecords, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "prime_master_database.json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        // Initialize table on load
        document.addEventListener('DOMContentLoaded', () => renderTable(dbRecords));
    </script>
</body>
</html>
